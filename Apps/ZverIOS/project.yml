name: ZverIOS
options:
  bundleIdPrefix: dev.zver
  deploymentTarget:
    iOS: "17.0"
packages:
  ZverCore:
    path: ../../Packages/ZverCore
  ZverMetadata:
    path: ../../Packages/ZverMetadata
  ZverTransport:
    path: ../../Packages/ZverTransport
  ZverStorage:
    path: ../../Packages/ZverStorage
  ZverBrain:
    path: ../../Packages/ZverBrain
  ZverImport:
    path: ../../Packages/ZverImport
targets:
  ZverIOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZverCore
      - package: ZverMetadata
      - package: ZverTransport
      - package: ZverStorage
      - package: ZverBrain
      - package: ZverImport
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6RWCS65D85
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Zver
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Zver ищет ваш Mac в локальной сети, чтобы импортировать с него альбомы."
        NSBonjourServices: [_zver._tcp]
        # «Открыть в Zver Media» из Safari/Files/AirDrop/почты. Rank Alternate —
        # мы не «владелец» этих типов, просто принимаем zip-архивы Bandcamp и
        # одиночные аудиофайлы. `.dsf` iOS не знает — объявляем импортируемый тип.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Музыка и архивы
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - public.audio
              - org.xiph.flac
              - com.sony.dsf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.sony.dsf
            UTTypeDescription: DSD Stream File
            UTTypeConformsTo:
              - public.audio
              - public.data
            UTTypeTagSpecification:
              public.filename-extension: [dsf]
              public.mime-type: [audio/x-dsf]
  ZverIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ZverIOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZverIOS:
    build:
      targets:
        ZverIOS: all
        ZverIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ZverIOSUITests]
